<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻量游戏合集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1e293b, #0f172a);
    min-height: 100vh; color: #e2e8f0; padding: 40px 20px;
  }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { font-size: 2rem; letter-spacing: 2px; }
  header p { color: #94a3b8; margin-top: 8px; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px; max-width: 900px; margin: 0 auto;
  }
  .card {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 24px; text-decoration: none; color: inherit;
    transition: transform .15s ease, box-shadow .15s ease; display: block;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .card .emoji { font-size: 2.4rem; }
  .card h2 { margin: 12px 0 6px; font-size: 1.2rem; }
  .card p.desc { color: #94a3b8; font-size: .85rem; min-height: 2.4em; }
  .card .stats { margin-top: 14px; font-size: .85rem; color: #7dd3fc; line-height: 1.7; }
  footer { text-align: center; color: #475569; margin-top: 40px; font-size: .8rem; }
</style>
</head>
<body>
<header>
  <h1>🎮 轻量游戏合集</h1>
  <p>和朋友随时开玩 · 进度自动保存在本地浏览器</p>
</header>
<main id="grid"></main>
<footer>本地离线运行 · localStorage 存档 · 数据不出浏览器</footer>

<script src="save.js"></script>
<script>
  // 公共存档模块兜底：save.js 加载失败时大厅仍可渲染
  var GameSave = window.GameSave || { load: function () { return {}; }, save: function () { return false; } };

  // 游戏注册表：新增游戏时在此登记
  var GAMES = [
    {
      id: "water-sort", name: "瓶子倒水", emoji: "🧪", href: "games/water-sort.html",
      desc: "把相同颜色的水倒回同一瓶",
      total: 50,
      bestText: null  // 不追踪最短步数，大厅不展示「最佳」行
    },
    {
      id: "sudoku", name: "数独", emoji: "🧩", href: "games/sudoku.html",
      desc: "填入 1-9，使每行每列每宫不重复",
      total: 10,
      bestText: function (v) { return v == null ? "—" : formatTime(v); }
    },
    {
      id: "tape-peel", name: "撕胶带", emoji: "🩹", href: "games/tape-peel.html",
      desc: "撕掉最上层、没被压住的胶带，层层撕完即过关",
      total: 5,
      bestText: function (v) { return v == null ? "—" : formatTime(v); }
    }
  ];

  function formatTime(sec) {
    sec = Math.round(sec);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m > 0 ? m + "分" + String(s).padStart(2, "0") + "秒" : s + "秒";
  }

  var grid = document.getElementById("grid");
  GAMES.forEach(function (g) {
    var save = GameSave.load(g.id, {});
    var card = document.createElement("a");
    card.className = "card";
    card.href = g.href;
    var statsHtml = '';
    if (g.bestText) statsHtml += '最佳：' + g.bestText(save.best) + '<br>';
    statsHtml += '通关：' + (save.completed || 0) + ' / ' + g.total;
    card.innerHTML =
      '<div class="emoji">' + g.emoji + '</div>' +
      '<h2>' + g.name + '</h2>' +
      '<p class="desc">' + g.desc + '</p>' +
      '<div class="stats">' + statsHtml + '</div>';
    grid.appendChild(card);
  });
</script>
</body>
</html>
