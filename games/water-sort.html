<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>瓶子倒水</title>
<!-- 公共存档模块（game-hub） -->
<script src="../save.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #14161f; color: #e8eaf0;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }

  /* 顶部 HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px;
    background: rgba(20, 22, 31, 0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #hud a.back {
    color: #e8eaf0; text-decoration: none;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
    transition: background .15s;
  }
  #hud a.back:hover { background: rgba(255,255,255,0.16); }
  #hud .title { font-weight: 700; letter-spacing: 1px; margin-right: 4px; }
  .chip { font-size: 13px; opacity: 0.85; padding: 6px 10px; }
  .pill {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #e8eaf0;
    padding: 6px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  .pill:hover { background: rgba(255,255,255,0.16); }
  .pill:active { transform: scale(0.96); }
  .pill.primary { background: rgba(80,170,255,0.18); border-color: rgba(80,170,255,0.5); }
  .pill.primary:hover { background: rgba(80,170,255,0.3); }
  .pill:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

  #hint {
    position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; z-index: 5;
    font-size: 12px; color: rgba(255,255,255,0.42);
  }

  /* 胜利弹窗 / 选关弹窗 */
  #winOverlay, #levelOverlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55);
  }
  #winOverlay.hidden, #levelOverlay.hidden { display: none; }
  .card {
    background: #20253a; border: 1px solid rgba(255,255,255,0.12); border-radius: 18px;
    padding: 28px 42px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: pop .25s ease-out;
  }
  .card-scroll { max-height: 78vh; overflow-y: auto; padding: 22px 26px; }
  #levelGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
    gap: 8px; max-width: 380px; margin: 16px auto;
  }
  #levelGrid button {
    aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06); color: #e8eaf0; font-size: 14px; cursor: pointer;
    transition: background .12s, transform .08s;
  }
  #levelGrid button:hover:not(.locked) { background: rgba(255,255,255,0.16); }
  #levelGrid button.done { background: rgba(46,204,113,0.20); border-color: rgba(46,204,113,0.45); }
  #levelGrid button.cur { outline: 2px solid rgba(130,220,255,0.9); }
  #levelGrid button.locked { opacity: 0.38; cursor: default; }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 { margin: 0 0 8px; font-size: 26px; }
  .card p { margin: 0 0 18px; color: rgba(255,255,255,0.7); }
  .card button { font-size: 15px; padding: 9px 22px; }
</style>

<body>
<div id="hud">
  <a class="back" href="../index.html">← 返回大厅</a>
  <span class="title">🍾 瓶子倒水</span>
  <span class="chip" id="levelLabel"></span>
  <span class="chip" id="moveLabel"></span>
  <span class="chip" id="devBadge" style="display:none; color:#ffd166; background:rgba(255,209,102,0.12); border:1px solid rgba(255,209,102,0.45);">DEV</span>
  <button class="pill" id="undoBtn">↩ 撤销</button>
  <button class="pill" id="restartBtn">⟲ 重开</button>

    <div style="display:flex; justify-content:center; gap:10px; margin-top:14px;">

</div>

  { colors:6, capacity:4, empty:2, seed:9000, minSteps:18, bottles:[[2,5,1,0],[0,5,5,4],[1,3,2,1],[3,3,4,2],[4,1,2,5],[0,4,3,0],[],[]] },
  { colors:6, capacity:4, empty:2, seed:9001, minSteps:18, bottles:[[0,2,1,4],[2,1,3,3],[4,1,5,0],[1,0,0,5],[2,4,5,3],[4,3,5,2],[],[]] },
  { colors:6, capacity:4, empty:2, seed:9002, minSteps:18, bottles:[[1,3,1,0],[5,2,4,5],[3,4,0,5],[4,3,3,0],[0,2,2,1],[5,4,2,1],[],[]] },

/* ================= 存档（接入 game-hub/save.js，key: "water-sort"） =================
   顶层字段：completed(已通关数 0-50)、currentLevel(当前关卡索引)
   注：关卡布局已离线固化（见 LEVELS），运行时零生成零 BFS，刷新秒开。 */
const SAVE_DEFAULTS = { completed: 0, currentLevel: 0 };
const save = window.GameSave ? window.GameSave.load('water-sort', SAVE_DEFAULTS)
                             : Object.assign({}, SAVE_DEFAULTS);
function persist(){
  if(!window.GameSave) return;
  window.GameSave.save('water-sort', save);
}

/* ================= 开发者模式 =================
   用途：测试时直接选任意关，无需一关关解开。
   开启方式：URL 加 ?dev=1，或在「选关」弹窗内点开发者模式按钮（状态存 localStorage）。 */
const DEV_KEY = 'game-hub:water-sort:dev';
let devMode = new URLSearchParams(location.search).get('dev') === '1';
if(!devMode){
  try { devMode = localStorage.getItem(DEV_KEY) === '1'; } catch(e){}
}
function setDevMode(on){
  devMode = on;
  try { localStorage.setItem(DEV_KEY, on ? '1' : '0'); } catch(e){}
  updateDevUI();
  if(!levelOverlay.classList.contains('hidden')) openLevels();
}
function updateDevUI(){
  const badge = document.getElementById('devBadge');
  if(badge) badge.style.display = devMode ? 'inline-block' : 'none';
  const t = document.getElementById('devToggle');
  if(t){
    t.textContent = devMode ? '🔧 开发者模式：开' : '🔧 开发者模式：关';
    t.classList.toggle('primary', devMode);
  }
  updateNextButton();
}

/* ================= DOM ================= */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const winOverlay = document.getElementById('winOverlay');
const levelOverlay = document.getElementById('levelOverlay');

/* ================= 游戏状态 ================= */
const state = {
  levelIndex: 0, capacity: 4,
  bottles: [], initial: [], moves: 0, history: [], selected: -1,
  positions: [], view: { scale: 1, offX: 0, offY: 0 }
};
let dpr = 1;
let anim = null;      // {i,k,color,amount,srcBefore,dstBefore,dir,t0,dur,t}
let flash = null;     // 错误闪烁
let winVisible = false;

/* ================= 纯逻辑（状态 + 合法性 + 胜利） ================= */
function topBlock(bottle){
  if(!bottle.length) return { color:-1, size:0 };
  const color = bottle[bottle.length-1];
  let size = 0;
  for(let j = bottle.length-1; j >= 0 && bottle[j] === color; j--) size++;
  return { color, size };
}
function canPour(bottles, i, k){
  if(i === k) return false;
  const src = bottles[i], dst = bottles[k];
  if(!src.length) return false;                      // 源瓶空
  if(dst.length >= state.capacity) return false;      // 目标满
  const tb = topBlock(src);
  return dst.length === 0 || dst[dst.length-1] === tb.color; // 空瓶 或 顶层同色
}
function doPour(bottles, i, k, cap){
  const src = bottles[i], dst = bottles[k];
  const tb = topBlock(src);
  const space = cap - dst.length;
  const n = Math.min(tb.size, space);
  for(let x = 0; x < n; x++){ src.pop(); dst.push(tb.color); }
  return n;
}
function isSolved(bottles, cap){
  return bottles.every(b => {
    if(!b.length) return true;
    return b.length === cap && b.every(c => c === b[0]);
  });
}
// 把瓶子数组拍平成「颜色段」列表，供绘制用；动画期间允许小数高度
function segmentsOf(bottle){
  const segs = [];
  for(const c of bottle){
    const last = segs[segs.length-1];
    if(last && last.color === c) last.units++;
    else segs.push({ color:c, units:1 });
  }
  return segs;
}
function segSum(segs){ return segs.reduce((a,s) => a + s.units, 0); }

/* ================= 关卡控制 ================= */
function loadLevel(){
  const cfg = LEVELS[state.levelIndex];
  state.capacity = cfg.capacity;
  state.bottles = cfg.bottles.map(b => b.slice());
  state.initial = state.bottles.map(b => b.slice());
  state.moves = 0; state.history = []; state.selected = -1; anim = null; flash = null;
  hideWin();
  layout(); updateHud();
  save.currentLevel = state.levelIndex;   // 记录当前关卡
  persist();
}
function restart(){
  state.bottles = state.initial.map(b => b.slice());
  state.moves = 0; state.history = []; state.selected = -1; anim = null; flash = null;
  hideWin(); updateHud();
}
function nextLevel(){
  // 顺序解锁：仅当前关已通关且非最后一关时才可进入下一关；开发者模式可跳过解锁
  if(state.levelIndex >= LEVELS.length - 1) return;
  if(!devMode && !(state.levelIndex < save.completed)) return;
  state.levelIndex = state.levelIndex + 1;
  loadLevel();
}
function openLevels(){
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  // 已解锁：已通关的关 + 当前关（顺序解锁下当前关恒 <= completed）；开发者模式全开
  const maxPlayable = devMode ? LEVELS.length - 1 : Math.max(state.levelIndex, save.completed);
  for(let i = 0; i < LEVELS.length; i++){
    const b = document.createElement('button');
    b.textContent = i + 1;
    const unlocked = i <= maxPlayable;
    if(!unlocked){ b.classList.add('locked'); b.textContent = '🔒'; }
    if(i < save.completed) b.classList.add('done');
    if(i === state.levelIndex) b.classList.add('cur');
    if(unlocked) b.addEventListener('click', function(){ gotoLevel(i); });
    grid.appendChild(b);
  }
  levelOverlay.classList.remove('hidden');
}
function closeLevels(){
  levelOverlay.classList.add('hidden');
}
function gotoLevel(i){
  state.levelIndex = i;
  hideWin();
  closeLevels();
  loadLevel();
}
function undo(){
  if(anim || !state.history.length) return;
  const snap = state.history.pop();
  state.bottles = snap.bottles;
  state.moves = snap.moves;
  state.selected = -1;
  hideWin(); updateHud();
}

/* ================= 布局（整体缩放适配屏幕） ================= */
function resize(){
  dpr = window.devicePixelRatio || 1;
  cvs.width  = Math.floor(window.innerWidth  * dpr);
  cvs.height = Math.floor(window.innerHeight * dpr);
  cvs.style.width  = window.innerWidth  + 'px';
  cvs.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
}
function layout(){
  const W = cvs.width / dpr, H = cvs.height / dpr;
  const n = state.bottles.length;
  if(n === 0){ state.view = { scale:1, offX:0, offY:0 }; state.positions = []; return; }
  const slotW = GEO.bodyW + 30, slotH = totalH + 56;
  const cols = Math.min(n, Math.max(1, Math.floor((W - 40) / slotW)));
  const rows = Math.ceil(n / cols);
  const gridW = cols * slotW, gridH = rows * slotH;
  // 顶部固定 HUD 在窄屏会换行变高：动态测量实际高度并为其让位，
  // 否则后期关卡顶排瓶口会被 HUD 遮住；底部再为提示文字留白。
  const hudEl = document.getElementById('hud');
  const hudH = hudEl ? Math.ceil(hudEl.getBoundingClientRect().height) : 60;
  const bottomReserve = 34;
  const availH = Math.max(1, H - hudH - bottomReserve);
  const scale = Math.min(1, (W - 40) / gridW, availH / gridH);
  state.view = { scale, offX:(W - gridW*scale)/2, offY: hudH + 8 + (availH - gridH*scale)/2 };
  state.positions = state.bottles.map((b, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    return { x: (col + 0.5) * slotW, y: row * slotH + slotH - 26 };
  });
}

/* ================= 绘制工具 ================= */
function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  if(r < 0) r = 0;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function bezier(p0, p1, p2, p3, tt){
  const u = 1 - tt;
  return {
    x: u*u*u*p0.x + 3*u*u*tt*p1.x + 3*u*tt*tt*p2.x + tt*tt*tt*p3.x,
    y: u*u*u*p0.y + 3*u*u*tt*p1.y + 3*u*tt*tt*p2.y + tt*tt*tt*p3.y
  };
}
function easeInOut(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

/* 画一个瓶子。bx,by 是瓶底中心（逻辑坐标）。o: {selected, done, tilt, flash} */
function drawBottle(ctx, bx, by, segs, o){
  o = o || {};
  const bodyW=GEO.bodyW, bodyH=GEO.bodyH, neckW=GEO.neckW, neckH=GEO.neckH,
        lipH=GEO.lipH, lipW=GEO.lipW, inset=GEO.inset, capH=GEO.capH;
  const lift = o.selected ? 16 : 0;
  const topY = by - totalH - lift;
  const bodyTop = topY + lipH + neckH;
  const bodyBottom = bodyTop + bodyH;
  const cx = bx;

  // 地面阴影（选中时影子变小、下沉）
  ctx.fillStyle = o.selected ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(cx, by + (o.selected ? 14 : 5), bodyW * 0.42, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // 倒水时围绕瓶口轻微倾斜
  const pivotY = topY;
  ctx.save();
  if(o.tilt){
    ctx.translate(cx, pivotY);
    ctx.rotate(o.tilt);
    ctx.translate(-cx, -pivotY);
  }

  // —— 液体 ——
  const interiorX = cx - bodyW/2 + inset;
  const interiorW = bodyW - 2*inset;
  const liquidBottom = bodyBottom;
  const liquidMaxTop = bodyTop + capH;
  const unitH = (liquidBottom - liquidMaxTop) / state.capacity;
  let curBottom = liquidBottom;
  for(let s = 0; s < segs.length; s++){
    const seg = segs[s];
    const segH = seg.units * unitH;
    const segTop = curBottom - segH;
    roundRect(ctx, interiorX, segTop, interiorW, curBottom - segTop, s === 0 ? 7 : 2);
    ctx.fillStyle = COLORS[seg.color] || '#888';
    ctx.fill();
    curBottom = segTop;
  }
  // 液面高光
  if(segs.length && curBottom < liquidBottom){
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(ctx, interiorX, curBottom - 1, interiorW, 2.5, 1.2);
    ctx.fill();
  }

  // —— 玻璃瓶身 ——
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.strokeStyle = 'rgba(255,255,255,0.40)';
  ctx.lineWidth = 2;
  roundRect(ctx, cx - bodyW/2, bodyTop, bodyW, bodyH, 12);
  ctx.fill(); ctx.stroke();
  // 瓶颈
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(cx - neckW/2, bodyTop);
  ctx.lineTo(cx - neckW/2, bodyTop - neckH);
  ctx.lineTo(cx + neckW/2, bodyTop - neckH);
  ctx.lineTo(cx + neckW/2, bodyTop);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 瓶口
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1.8;
  roundRect(ctx, cx - lipW/2, topY, lipW, lipH, 3);
  ctx.fill(); ctx.stroke();
  // 玻璃高光
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(ctx, cx - bodyW/2 + 7, bodyTop + 9, 7, bodyH - 18, 3);
  ctx.fill();
  // 已完成 → 封盖（仅视觉提示，仍可倒出）
  if(o.done){
    ctx.fillStyle = COLORS[segs[0].color] || '#888';
    roundRect(ctx, cx - lipW/2 - 2, topY - 9, lipW + 4, 10, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();

  // 选中光圈（不随倾斜）
  if(o.selected){
    ctx.strokeStyle = 'rgba(130,220,255,0.9)';
    ctx.lineWidth = 2.5;
    roundRect(ctx, cx - bodyW/2 - 7, topY - 5, bodyW + 14, totalH + 10, 18);
    ctx.stroke();
  }
  // 非法操作红色闪烁
  if(o.flash){
    ctx.strokeStyle = 'rgba(255,80,80,0.85)';
    ctx.lineWidth = 2.5;
    roundRect(ctx, cx - bodyW/2 - 7, topY - 5, bodyW + 14, totalH + 10, 18);
    ctx.stroke();
  }
}

/* 倒水流束 */
function drawStream(ctx, anim){
  const p = state.positions;
  const sx = p[anim.i].x, sy = p[anim.i].y - totalH;   // 源瓶口
  const dx = p[anim.k].x, dy = p[anim.k].y - totalH;   // 目标瓶口
  const c1 = { x: sx, y: sy + 34 }, c2 = { x: dx, y: dy - 34 };
  const color = COLORS[anim.color] || '#888';
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = color; ctx.globalAlpha = 0.9; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, dx, dy); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.globalAlpha = 0.65; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.globalAlpha = 1;
  // 下落水珠
  for(const f of [0.3, 0.6]){
    const pt = bezier({ x: sx, y: sy }, c1, c2, { x: dx, y: dy }, f);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y + (1 - anim.t) * 14, 3.6 * (1 - 0.4 * anim.t), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* 生成当前帧每瓶的绘制段（动画期间源/目标做平滑插值） */
function buildSegArrays(){
  const arr = [];
  for(let i = 0; i < state.bottles.length; i++){
    let segs = segmentsOf(state.bottles[i]);
    if(anim){
      if(i === anim.i){
        segs = segmentsOf(anim.srcBefore);
        const top = segs.pop();
        const rem = top.units * (1 - anim.t);
        if(rem > 0.03) segs.push({ color: top.color, units: rem });
      } else if(i === anim.k){
        segs = segmentsOf(anim.dstBefore);
        const extra = anim.amount * anim.t;
        if(extra > 0.03) segs.push({ color: anim.color, units: extra });
      }
    }
    arr.push(segs);
  }
  return arr;
}

/* ================= 渲染主循环 ================= */
function render(now){
  const W = cvs.width / dpr, H = cvs.height / dpr;
  // 背景
  const g = ctx.createRadialGradient(W/2, H*0.35, 0, W/2, H*0.5, Math.max(W, H) * 0.8);
  g.addColorStop(0, '#232840'); g.addColorStop(1, '#14161f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const segsArr = buildSegArrays();
  ctx.save();
  ctx.translate(state.view.offX, state.view.offY);
  ctx.scale(state.view.scale, state.view.scale);

  for(let i = 0; i < state.bottles.length; i++){
    const p = state.positions[i];
    let dx = 0;
    if(flash && flash.idx === i){
      const dt = now - flash.t0;
      if(dt < 450) dx = Math.sin(dt / 28) * 5;
      else flash = null;
    }
    const segs = segsArr[i];
    const done = segs.length === 1 && Math.round(segSum(segs)) === state.capacity;
    const tilt = (anim && i === anim.i) ? 0.16 * anim.t * anim.dir : 0;
    drawBottle(ctx, p.x + dx, p.y, segs, {
      selected: i === state.selected,
      done: done,
      tilt: tilt,
      flash: !!(flash && flash.idx === i)
    });
  }
  if(anim) drawStream(ctx, anim);
  ctx.restore();
}

function frame(now){
  if(anim){
    const t = Math.min(1, (now - anim.t0) / anim.dur);
    anim.t = easeInOut(t);
    if(t >= 1){
      anim = null;
      if(isSolved(state.bottles, state.capacity)) showWin();
    }
  }
  render(now);
  requestAnimationFrame(frame);
}

/* ================= 交互 ================= */
function hitTest(mx, my){
  const v = state.view;
  const bx = (mx - v.offX) / v.scale, by = (my - v.offY) / v.scale;
  for(let i = state.positions.length - 1; i >= 0; i--){
    const p = state.positions[i];
    if(bx >= p.x - GEO.bodyW/2 - 8 && bx <= p.x + GEO.bodyW/2 + 8 &&
       by >= p.y - totalH - 18 && by <= p.y + 8) return i;
  }
  return -1;
}

function onPointer(e){
  if(anim || winVisible) return;
  const rect = cvs.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const idx = hitTest(mx, my);
  if(idx < 0) return;

  // 未选中 → 选中一个非空瓶
  if(state.selected === -1){
    if(state.bottles[idx].length) state.selected = idx;
    return;
  }
  // 再点同一瓶 → 取消选中
  if(state.selected === idx){ state.selected = -1; return; }

  const i = state.selected, k = idx;
  if(canPour(state.bottles, i, k)){
    const srcBefore = state.bottles[i].slice();
    const dstBefore = state.bottles[k].slice();
    const tb = topBlock(srcBefore);
    state.history.push({ bottles: state.bottles.map(b => b.slice()), moves: state.moves });
    const amount = doPour(state.bottles, i, k, state.capacity);
    state.moves++;
    state.selected = -1;
    const dir = state.positions[k].x >= state.positions[i].x ? 1 : -1;
    anim = { i, k, color: tb.color, amount, srcBefore, dstBefore, dir,
             t0: performance.now(), dur: 280, t: 0 };
    updateHud();
  } else {
    flash = { idx: i, t0: performance.now() };
  }
}

/* ================= HUD ================= */
function updateHud(){
  document.getElementById('levelLabel').textContent = '第 ' + (state.levelIndex + 1) + ' / ' + LEVELS.length + ' 关';
  document.getElementById('moveLabel').textContent = '步数 ' + state.moves;
  updateNextButton();
}
function updateNextButton(){
  // 顺序解锁：下一关仅当「当前关已通关」且「非最后一关」时可用；开发者模式恒可进
  const canNext = devMode ? state.levelIndex < LEVELS.length - 1
                          : (state.levelIndex < save.completed && state.levelIndex < LEVELS.length - 1);
  document.getElementById('nextBtn').disabled = !canNext;
}
function showWin(){
  winVisible = true;
  const last = state.levelIndex === LEVELS.length - 1;
  document.getElementById('winTitle').textContent = last ? '🎉 全部通关！' : '🎉 过关！';
  document.getElementById('winText').textContent = '用了 ' + state.moves + ' 步完成本关';
  document.getElementById('winNext').textContent = last ? '返回选关' : '下一关';
  // 写入存档：completed 取已通关最大关卡数
  save.completed = Math.max(save.completed, state.levelIndex + 1);
  save.currentLevel = (state.levelIndex + 1) % LEVELS.length;
  persist();
  updateHud();
  winOverlay.classList.remove('hidden');
}
function hideWin(){
  winVisible = false;
  winOverlay.classList.add('hidden');
}

/* ================= 启动 ================= */
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('restartBtn').addEventListener('click', restart);
document.getElementById('nextBtn').addEventListener('click', nextLevel);
document.getElementById('levelsBtn').addEventListener('click', openLevels);
document.getElementById('levelClose').addEventListener('click', closeLevels);
document.getElementById('devToggle').addEventListener('click', function(){ setDevMode(!devMode); });
document.getElementById('winNext').addEventListener('click', function(){
  // 最后一关按钮为「返回选关」；其余按顺序解锁进入下一关
  if(state.levelIndex === LEVELS.length - 1){ hideWin(); openLevels(); }
  else nextLevel();
});
cvs.addEventListener('pointerdown', onPointer);
window.addEventListener('resize', resize);
resize();
// 顺序解锁：恢复时夹取到 [0, min(49, completed)]，completed=0 时强制从第 1 关开始；开发者模式可进任意关
const maxUnlocked = devMode ? LEVELS.length - 1
                            : Math.min(LEVELS.length - 1, Math.max(0, Number(save.completed) || 0));
state.levelIndex = Math.max(0, Math.min(Number(save.currentLevel) || 0, maxUnlocked));
updateDevUI();
loadLevel();
requestAnimationFrame(frame);
</script>
</body>
