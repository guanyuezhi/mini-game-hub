<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>猜数字 · 轻量游戏合集</title>
<!-- 大厅注册信息（index.html GAMES 表新增项，勿改本文件外的代码）：
     { id:"mastermind", name:"猜数字", emoji:"🎯", href:"games/mastermind.html",
       desc:"根据黑白反馈破译隐藏的颜色密码", total:10,
       bestText: function(v){ return v == null ? "—" : "最少 " + v + " 次猜中"; } } -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1e293b, #0f172a);
    min-height: 100vh; color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 12px 40px;
  }
  header {
    width: min(92vw, 480px); margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .back { color: #94a3b8; text-decoration: none; font-size: 15px; }
  .back:hover { color: #7dd3fc; }
  .top { display: flex; align-items: center; gap: 14px; font-size: 15px; }
  #levelLabel { color: #e2e8f0; letter-spacing: 1px; }
  #remainLabel { color: #fbbf24; font-variant-numeric: tabular-nums; }

  .title-bar {
    width: min(92vw, 480px); text-align: center;
    font-size: 1.2rem; font-weight: 700; letter-spacing: 2px;
    color: #7dd3fc; margin: 2px 0 12px;
  }

  #history {
    width: min(92vw, 480px); min-height: 110px; max-height: 44vh;
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px; overflow-y: auto;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.05); border-radius: 10px; padding: 8px 12px;
  }
  .row-guess { display: flex; gap: 8px; align-items: center; }
  .gdot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
  }
  .row-fb { display: flex; gap: 4px; align-items: center; min-width: 76px; justify-content: flex-end; }
  .fdot { width: 10px; height: 10px; border-radius: 50%; }
  .fdot.b { background: #0b0f19; border: 1px solid rgba(255,255,255,.7); }
  .fdot.w { background: transparent; border: 1.5px solid #e2e8f0; }
  .fdot.e { background: transparent; border: 1px solid rgba(255,255,255,.18); }

  #currentRow {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    width: min(92vw, 480px); margin-top: 16px; padding: 12px 0;
  }
  .slot {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,.06);
    border: 2px solid rgba(255,255,255,.22);
    cursor: pointer; transition: transform .08s, border-color .08s;
  }
  .slot.sel { border-color: #7dd3fc; box-shadow: 0 0 0 2px rgba(125,211,252,.35); }
  .slot.empty:hover { background: rgba(255,255,255,.13); }
  .slot:active { transform: scale(.94); }

  #palette {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    width: min(92vw, 480px); margin-top: 4px;
  }
  #palette button {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.28); cursor: pointer;
    transition: transform .08s, border-color .08s;
  }
  #palette button:hover { transform: scale(1.12); }
  #palette button:active { transform: scale(.95); }

  #controls {
    display: flex; gap: 10px; flex-wrap: wrap;
    width: min(92vw, 480px); margin-top: 16px;
  }
  #controls button {
    flex: 1; min-width: 84px; padding: 11px 0; font-size: 15px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.07); color: #e2e8f0; cursor: pointer;
  }
  #controls button:hover:not(:disabled) { background: rgba(255,255,255,.14); }
  #controls button:disabled { opacity: .35; cursor: default; }
  #controls button.primary { background: #0284c7; border-color: #0284c7; color: #fff; font-weight: 600; }
  #controls button.primary:hover:not(:disabled) { filter: brightness(1.12); background: #0284c7; }

  .hint { margin-top: 16px; font-size: 12.5px; color: #64748b; text-align: center; line-height: 1.8; }

  #modal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(2, 6, 23, .72);
    display: flex; align-items: center; justify-content: center;
  }
  #modal.hidden { display: none; }
  .modal-box {
    background: #1e293b; border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 26px 30px; text-align: center;
    max-width: 360px; width: 88%;
  }
  .modal-box h2 { font-size: 1.55rem; margin-bottom: 10px; }
  .modal-box p { color: #94a3b8; margin: 6px 0; font-size: 15px; }
  .modal-box .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .modal-box button {
    flex: 1; padding: 11px 0; font-size: 15px; cursor: pointer;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.08); color: #e2e8f0;
  }
  .modal-box button.primary { background: #0284c7; border-color: #0284c7; color: #fff; font-weight: 600; }
  .modal-box button:hover { filter: brightness(1.12); }
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← 返回大厅</a>
  <div class="top">
    <span id="levelLabel">第 1 / 10 关</span>
    <span id="remainLabel">剩余 7 次</span>
  </div>
</header>

<div class="title-bar">🎯 猜数字</div>

<main id="history"></main>

<div id="currentRow"></div>

<div id="palette"></div>

<div id="controls">
  <button id="clearBtn">⌫ 清除</button>
  <button id="submitBtn" class="primary">提交</button>
  <button id="prevBtn">上一关</button>
  <button id="restartBtn">重开本关</button>
  <button id="nextBtn">下一关</button>
</div>

<div class="hint">先点位置再选颜色 · 黑点=位置颜色都对 · 白点=颜色对但位置错</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h2 id="modalTitle">🎉 恭喜过关！</h2>
    <p id="modalMsg"></p>
    <div class="actions">
      <button id="modalReplayBtn">重玩本关</button>
      <button id="modalNextBtn" class="primary">下一关 →</button>
    </div>
  </div>
</div>

<script src="../save.js"></script>
<script>
'use strict';

/* ================= 关卡表（离线固化，mulberry32 生成 + 贪心 minimax 验证，见 tools/gen-mastermind.js） =================
   字段：pegs=位置数 · colors=颜色数 · dup=1 允许重复 / 0 各位置互异 · maxGuesses=猜次上限
        secret=隐藏的秘密码 · optimal=求解器所需最少猜次（展示/参考） */
var LEVELS = [
  { pegs:4, colors:6, dup:1, maxGuesses:7, secret:[4,4,4,5], optimal:4 },
  { pegs:4, colors:6, dup:1, maxGuesses:6, secret:[3,5,5,2], optimal:4 },
  { pegs:4, colors:7, dup:1, maxGuesses:6, secret:[5,5,0,3], optimal:6 },
  { pegs:4, colors:8, dup:1, maxGuesses:7, secret:[4,0,2,7], optimal:6 },
  { pegs:4, colors:7, dup:0, maxGuesses:7, secret:[0,1,2,6], optimal:4 },
  { pegs:4, colors:8, dup:0, maxGuesses:7, secret:[6,4,3,7], optimal:5 },
  { pegs:5, colors:6, dup:0, maxGuesses:8, secret:[3,2,4,1,0], optimal:5 },
  { pegs:5, colors:7, dup:0, maxGuesses:8, secret:[1,2,5,6,3], optimal:6 },
  { pegs:5, colors:8, dup:0, maxGuesses:8, secret:[0,6,3,5,2], optimal:5 },
  { pegs:5, colors:8, dup:0, maxGuesses:7, secret:[7,0,6,4,3], optimal:6 }
];
var TOTAL = LEVELS.length;

/* ================= 求解器（与 tools/gen-mastermind.js 同实现，供 verify 重算） ================= */

/** 反馈：black = 位置和颜色都对；white = 颜色对但位置错（= total - black）。 */
function feedback(secret, guess, pegs) {
  var black = 0, maxC = 0, i;
  for (i = 0; i < pegs; i++) {
    if (secret[i] === guess[i]) black++;
    if (secret[i] > maxC) maxC = secret[i];
    if (guess[i] > maxC) maxC = guess[i];
  }
  var sc = new Array(maxC + 1).fill(0);
  var gc = new Array(maxC + 1).fill(0);
  for (i = 0; i < pegs; i++) { sc[secret[i]]++; gc[guess[i]]++; }
  var total = 0;
  for (i = 0; i <= maxC; i++) total += Math.min(sc[i], gc[i]);
  return { black: black, white: total - black };
}

/** 候选全集：所有长度 pegs、取值 0..colors-1 的码；dup=0 时要求各位置互异。 */
function makeCodeSet(pegs, colors, dup) {
  var codes = [], total = 1, i, n;
  for (i = 0; i < pegs; i++) total *= colors;
  for (n = 0; n < total; n++) {
    var x = n, code = new Array(pegs), p;
    for (p = pegs - 1; p >= 0; p--) { code[p] = x % colors; x = Math.floor(x / colors); }
    if (dup === 0) {
      var seen = {}, ok = true, q;
      for (q = 0; q < pegs; q++) { if (seen[code[q]]) { ok = false; break; } seen[code[q]] = 1; }
      if (!ok) continue;
    }
    codes.push(code);
  }
  return codes;
}

function codeHist(code, colors) {
  var h = new Array(colors).fill(0), i;
  for (i = 0; i < code.length; i++) h[code[i]]++;
  return h;
}

function sameCode(a, b, pegs) {
  for (var i = 0; i < pegs; i++) if (a[i] !== b[i]) return false;
  return true;
}

/** 贪心 minimax 选猜：从 S 中选使「按 feedback 分组后最大组大小」最小的猜测（平手取首个）。 */
function minimaxPick(S, hist, pegs, colors) {
  var N = S.length;
  var stride = pegs + 1;
  var counts = new Int32Array(stride * stride);
  var used = new Array(stride * stride);
  var bestScore = N;
  var bestGuess = S[0];
  for (var gi = 0; gi < N; gi++) {
    var g = S[gi], hg = hist[gi];
    var localMax = 0, nUsed = 0;
    for (var si = 0; si < N; si++) {
      var s = S[si];
      var b = 0;
      for (var p = 0; p < pegs; p++) if (s[p] === g[p]) b++;
      var hs = hist[si];
      var tot = 0;
      for (var c = 0; c < colors; c++) tot += hs[c] < hg[c] ? hs[c] : hg[c];
      var key = b * stride + (tot - b);
      if (counts[key] === 0) used[nUsed++] = key;
      var v = counts[key] + 1;
      counts[key] = v;
      if (v > localMax) localMax = v;
    }
    for (var u = 0; u < nUsed; u++) counts[used[u]] = 0;
    if (localMax < bestScore) { bestScore = localMax; bestGuess = g; }
  }
  return bestGuess;
}

var _codeSetCache = {};
var _histCache = {};
var _firstGuessCache = {};
function _cfgKey(pegs, colors, dup) { return pegs + '|' + colors + '|' + dup; }

/** 求解：返回贪心 minimax 所需猜次（<= maxGuesses），超预算返回 null。 */
function solveGreedy(secret, pegs, colors, dup, maxGuesses) {
  var key = _cfgKey(pegs, colors, dup);
  var S = _codeSetCache[key] || (_codeSetCache[key] = makeCodeSet(pegs, colors, dup));
  var hist = _histCache[key] || (_histCache[key] = S.map(function (c) { return codeHist(c, colors); }));
  var first = _firstGuessCache[key];
  if (first === undefined) { first = minimaxPick(S, hist, pegs, colors); _firstGuessCache[key] = first; }
  var steps = 0;
  while (true) {
    var g = steps === 0 ? first : minimaxPick(S, hist, pegs, colors);
    steps++;
    if (sameCode(g, secret, pegs)) return steps;
    if (steps >= maxGuesses) return null;
    var fb = feedback(secret, g, pegs);
    var nS = [], nHist = [], i;
    for (i = 0; i < S.length; i++) {
      var f = feedback(S[i], g, pegs);
      if (f.black === fb.black && f.white === fb.white) { nS.push(S[i]); nHist.push(hist[i]); }
    }
    S = nS; hist = nHist;
  }
}

/* ================= 存档（接入 game-hub/save.js，key: "mastermind"） =================
   顶层字段：completed(已通关数) · currentLevel(当前关卡索引) · best(最少猜中次数，越小越好) */
var GameSave = window.GameSave || {
  load: function (id, d) { return d || {}; },
  save: function () { return false; }
};

/* ================= 常量与状态 ================= */
var PALETTE = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#f97316', '#14b8a6', '#ec4899'];

var historyEl = document.getElementById('history');
var currentRowEl = document.getElementById('currentRow');
var paletteEl = document.getElementById('palette');
var levelLabel = document.getElementById('levelLabel');
var remainLabel = document.getElementById('remainLabel');

var currentLevel = 0;
var completed = 0;
var best = null;          // 最少猜中次数（跨关全局最小值）
var pegs = 0, colors = 0, dup = 0, maxGuesses = 0;
var secret = [];
var guesses = [];         // [{ guess:[...], black, white }]
var current = [];         // 当前猜测，长度 pegs，-1 表示空位
var selected = -1;
var won = false;

/* ================= 读存档（夹取 currentLevel 到 [0, min(TOTAL-1, completed)]） ================= */
var saved = GameSave.load('mastermind', { completed: 0, currentLevel: 0, best: null });
if (typeof saved.completed === 'number') completed = saved.completed;
if (typeof saved.best === 'number') best = saved.best;
currentLevel = Math.min(Math.max(saved.currentLevel || 0, 0), TOTAL - 1);
if (currentLevel > completed) currentLevel = completed; // 防数据不一致

/* ================= 关卡 ================= */
function loadLevel(idx) {
  currentLevel = idx;
  var cfg = LEVELS[idx];
  pegs = cfg.pegs; colors = cfg.colors; dup = cfg.dup; maxGuesses = cfg.maxGuesses;
  secret = cfg.secret.slice();
  guesses = [];
  current = new Array(pegs).fill(-1);
  selected = -1;
  won = false;
  levelLabel.textContent = '第 ' + (idx + 1) + ' / ' + TOTAL + ' 关';
  buildPalette();
  renderAll();
  saveProgress();
}

function restart() {
  hideModal();
  guesses = [];
  current = new Array(pegs).fill(-1);
  selected = -1;
  won = false;
  renderAll();
}

function goNext() { loadLevel(Math.min(currentLevel + 1, TOTAL - 1)); }
function goPrev() { loadLevel(Math.max(currentLevel - 1, 0)); }

/* ================= 渲染 ================= */
function renderAll() {
  renderHistory();
  renderCurrent();
  updateHud();
  updateButtons();
}

function renderHistory() {
  historyEl.innerHTML = '';
  for (var r = 0; r < guesses.length; r++) {
    var g = guesses[r];
    var row = document.createElement('div');
    row.className = 'row';
    var left = document.createElement('div');
    left.className = 'row-guess';
    for (var i = 0; i < pegs; i++) {
      var dot = document.createElement('span');
      dot.className = 'gdot';
      dot.style.background = PALETTE[g.guess[i]];
      left.appendChild(dot);
    }
    var right = document.createElement('div');
    right.className = 'row-fb';
    for (var k = 0; k < pegs; k++) {
      var f = document.createElement('span');
      f.className = 'fdot';
      if (k < g.black) f.className += ' b';
      else if (k < g.black + g.white) f.className += ' w';
      else f.className += ' e';
      right.appendChild(f);
    }
    row.appendChild(left);
    row.appendChild(right);
    historyEl.appendChild(row);
  }
  historyEl.scrollTop = historyEl.scrollHeight;
}

function renderCurrent() {
  currentRowEl.innerHTML = '';
  for (var i = 0; i < pegs; i++) {
    var s = document.createElement('div');
    s.className = 'slot' + (i === selected ? ' sel' : '');
    s.setAttribute('data-i', i);
    if (current[i] >= 0) {
      s.style.background = PALETTE[current[i]];
      s.style.borderColor = 'transparent';
    } else {
      s.className += ' empty';
    }
    currentRowEl.appendChild(s);
  }
}

function buildPalette() {
  paletteEl.innerHTML = '';
  for (var c = 0; c < colors; c++) {
    var b = document.createElement('button');
    b.setAttribute('data-c', c);
    b.style.background = PALETTE[c];
    b.title = '颜色 ' + (c + 1);
    paletteEl.appendChild(b);
  }
}

/* ================= HUD ================= */
function updateHud() {
  var remaining = maxGuesses - guesses.length;
  remainLabel.textContent = '剩余 ' + Math.max(0, remaining) + ' 次';
  document.getElementById('submitBtn').disabled = won || current.indexOf(-1) >= 0;
}

function updateButtons() {
  document.getElementById('prevBtn').disabled = currentLevel <= 0;
  document.getElementById('nextBtn').disabled = !(currentLevel < TOTAL - 1 && currentLevel < completed);
}

/* ================= 交互 ================= */
function placeColor(c) {
  if (won || c < 0 || c >= colors || selected < 0) return;
  current[selected] = c;
  var next = current.indexOf(-1);
  selected = next;
  renderCurrent();
  updateHud();
}

function submitGuess() {
  if (won || current.indexOf(-1) >= 0) return;
  var fb = feedback(secret, current, pegs);
  guesses.push({ guess: current.slice(), black: fb.black, white: fb.white });
  current = new Array(pegs).fill(-1);
  selected = -1;
  var used = guesses.length;
  if (fb.black === pegs) {
    won = true;
    if (best === null || used < best) best = used;
    completed = Math.max(completed, currentLevel + 1);
    GameSave.save('mastermind', {
      completed: completed,
      currentLevel: Math.min(currentLevel + 1, TOTAL - 1),
      best: best
    });
    renderAll();
    showWinModal(used);
    return;
  }
  if (used >= maxGuesses) {
    renderAll();
    showFailModal();
    return;
  }
  renderAll();
}

/* ================= 弹窗 ================= */
function showWinModal(used) {
  var isLast = currentLevel === TOTAL - 1;
  document.getElementById('modalTitle').textContent = isLast ? '🏆 全部通关！' : '🎉 恭喜过关！';
  document.getElementById('modalMsg').textContent = '用了 ' + used + ' 次猜中 · 最佳 ' + (best == null ? '—' : best) + ' 次';
  document.getElementById('modalNextBtn').style.display = isLast ? 'none' : '';
  document.getElementById('modal').classList.remove('hidden');
}

function showFailModal() {
  document.getElementById('modalTitle').textContent = '😵 挑战失败';
  document.getElementById('modalMsg').textContent = '已达最多 ' + maxGuesses + ' 次猜测，正确密码未破解';
  document.getElementById('modalNextBtn').style.display = 'none';
  document.getElementById('modal').classList.remove('hidden');
}

function hideModal() {
  document.getElementById('modal').classList.add('hidden');
}

/* ================= 存档 ================= */
function saveProgress() {
  GameSave.save('mastermind', { completed: completed, currentLevel: currentLevel, best: best });
}

/* ================= 事件绑定 ================= */
currentRowEl.addEventListener('click', function (e) {
  var slot = e.target.closest('.slot');
  if (!slot || won) return;
  var i = parseInt(slot.getAttribute('data-i'), 10);
  if (current[i] >= 0) current[i] = -1;
  selected = i;
  renderCurrent();
  updateHud();
});

paletteEl.addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  placeColor(parseInt(btn.getAttribute('data-c'), 10));
});

document.getElementById('clearBtn').addEventListener('click', function () {
  if (won) return;
  current = new Array(pegs).fill(-1);
  selected = -1;
  renderCurrent();
  updateHud();
});
document.getElementById('submitBtn').addEventListener('click', submitGuess);
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('restartBtn').addEventListener('click', restart);
document.getElementById('nextBtn').addEventListener('click', goNext);

document.getElementById('modalReplayBtn').addEventListener('click', restart);
document.getElementById('modalNextBtn').addEventListener('click', function () {
  hideModal();
  goNext();
});

/* ================= 导出（verify 用） ================= */
window.__game = {
  LEVELS: LEVELS,
  feedback: feedback,
  makeCodeSet: makeCodeSet,
  solveGreedy: solveGreedy
};

/* ================= 启动 ================= */
loadLevel(currentLevel);
</script>
</body>
</html>
